exclude: |
  (?x)^(
      groups_cache/.*|    # Generated institute group caches
      data/.*|            # Generated static data assets
      \.git/.*|           # Git internals
  )$
fail_fast: false
default_language_version:
  python: python3

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-ast           # Validates Python syntax
      - id: debug-statements    # Catches leftover breakpoint()/pdb calls
      - id: detect-private-key
      - id: check-case-conflict

  # Python — ruff covers linting + import sorting + pyupgrade in one pass
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python]
      - id: ruff-format
        types_or: [python]

  # JS / CSS / HTML / JSON formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, css, html]
        args: [--single-quote, --print-width=100]
