name: Update Pages Data

on:
  workflow_dispatch:
    inputs:
      institute:
        description: 'Institute code or All'
        type: string
        default: 'All'
      force_redownload:
        description: 'Force redownload all schedules'
        type: boolean
        default: false
  schedule:
    - cron: '15 4 * * *'

permissions:
  contents: write

concurrency:
  group: update-pages-data
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LPNU_INSTITUTE: ${{ inputs.institute || 'All' }}
      LPNU_FORCE_REDOWNLOAD: ${{ inputs.force_redownload && '1' || '0' }}
      LPNU_PARTIAL_FALLBACK_TO_ALL: '1'
      GROUPS_FETCH_SUMMARY_PATH: .tmp/groups_fetch_summary.json
      BATCH_SUMMARY_PATH: .tmp/batch_summary.json

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare temp directory
        run: mkdir -p .tmp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh institutes cache
        env:
          LPNU_GROUPS_FETCH_SUMMARY_PATH: ${{ env.GROUPS_FETCH_SUMMARY_PATH }}
        run: python fetch_institute_groups.py

      - name: Download schedules
        env:
          LPNU_BATCH_SUMMARY_PATH: ${{ env.BATCH_SUMMARY_PATH }}
        run: python batch_schedule_downloader.py

      - name: Generate room occupancy
        run: python generate_room_status.py --force

      - name: Build static data bundle
        run: python scripts/build_static_data.py

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Add workflow run summary
        if: always()
        env:
          GROUPS_FETCH_SUMMARY_PATH: ${{ env.GROUPS_FETCH_SUMMARY_PATH }}
          BATCH_SUMMARY_PATH: ${{ env.BATCH_SUMMARY_PATH }}
          INDEX_SUMMARY_PATH: data/index.json
        run: python scripts/write_workflow_summary.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-debug-summaries
          path: |
            .tmp/groups_fetch_summary.json
            .tmp/batch_summary.json
          if-no-files-found: ignore

      - name: Publish static bundle to gh_pages
        if: ${{ success() }}
        run: |
          set -euo pipefail

          git fetch origin gh_pages
          git branch -f gh_pages origin/gh_pages
          git worktree add /tmp/gh-pages gh_pages

          rsync -av --delete --exclude CNAME \
            index.html style.css script.js _headers \
            /tmp/gh-pages/
          rsync -av --delete data/ /tmp/gh-pages/data/
          : > /tmp/gh-pages/.nojekyll

          cd /tmp/gh-pages
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh static data"
          git push origin HEAD:gh_pages
